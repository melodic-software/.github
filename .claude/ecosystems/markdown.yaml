# Markdown in this repository. Contract and schema:
# https://github.com/melodic-software/claude-code-plugins/tree/main/docs/contracts/ecosystem-commands
# markdownlint-cli2 with the root config, as CI's markdownlint lane runs it
# (.github/workflows/pr-require-checks.yml:89-102 calls the ci-workflows
# markdownlint composite @594987a, which runs markdownlint-cli2 0.23.2 with
# --config .markdownlint-cli2.jsonc). Run from PATH; no command here installs
# anything. Commands run from the repository root.
enabled: true
globs: ["*.md"]
project-discovery: []
build-cmd: null
test-cmd: null
check-cmd: 'markdownlint-cli2 --config "$REPO_ROOT/.markdownlint-cli2.jsonc" <files>'
fix-cmd: 'markdownlint-cli2 --config "$REPO_ROOT/.markdownlint-cli2.jsonc" --fix <files>'
code-fix-cmd: null
opt-in: ".markdownlint-cli2.jsonc at the repository root"
install-hint: "npm i -g markdownlint-cli2@0.23.2 (the version CI runs) puts it on PATH"
tool-pin:
  markdownlint-cli2: "0.23.2"
gates: []
notes: "CI runs npx --yes markdownlint-cli2@0.23.2 over every **/*.md; this record runs the PATH binary over the changed files only, so it never downloads."
