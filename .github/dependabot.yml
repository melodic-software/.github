version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    cooldown:
      default-days: 3
    groups:
      # Listed before the catch-all because a dependency joins the first group it matches:
      # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#groups--
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        update-types: [minor, patch]
      github-actions:
        patterns:
          - '*'
