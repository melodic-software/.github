version: 2
updates:
  # Keep the SHA-pinned actions in this repo's workflows current. Merge lanes
  # follow the standards dependabot-policy component: the `vendor-actions`
  # group (non-major only) is the auto-merge lane armed by
  # pr-automerge-dependabot.yml; every other PR is reviewed by hand. This repo
  # carries no composite actions of its own, so the single "/" target (which
  # scans .github/workflows) is sufficient.
  - package-ecosystem: github-actions
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # Delay version bumps so a compromised or yanked release is caught before we
    # adopt it; security updates bypass cooldown. Defense-in-depth for the
    # SHA-rewrite supply-chain risk that motivates SHA-pinning.
    cooldown:
      default-days: 3
    groups:
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        update-types: [minor, patch]
      github-actions:
        patterns:
          - '*'
    # ci-workflows composites move by hand so the fleet stays on one
    # ci-workflows SHA; a bump to an unreviewed SHA fails the Runner policy
    # contract fleet-wide. See melodic-software/github-iac#378.
    ignore:
      - dependency-name: "melodic-software/ci-workflows/*"
