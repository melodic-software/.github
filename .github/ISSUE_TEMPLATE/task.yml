name: Task
description: A chore, maintenance task, audit, or other housekeeping item.
type: Task
labels: ["priority: needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why?
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Affected area / component
      description: Which part of the project does this affect?
