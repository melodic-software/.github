name: pr-title

# Conventional Commits PR-title gate. Calls the shared semantic-pr reusable
# workflow from ci-workflows. This repo is squash-only with the squash title set
# to PR_TITLE, so the PR title becomes the default-branch commit subject; this
# gates that subject against Conventional Commits. `edited` re-validates on a
# re-title; `synchronize` keeps the check fresh across pushes. The emitted
# required-check context is `pr-title / pr-title` (caller job / reusable job),
# the exact context the org `ci-gate` ruleset requires.
#
# `pull_request_target`, not `pull_request`: this workflow now matches the
# canonical consumer block in ci-workflows' README, whose own in-repo
# `pr-title.yml` that README names as the file NOT to copy. Under
# `pull_request` a fork PR runs the HEAD definition of this file, so a
# contributor could repoint the `uses:` below and emit a green
# `pr-title / pr-title` themselves; `pull_request_target` always runs the
# base-branch definition instead. Safe here because semantic-pr reads PR title
# metadata only — it checks out and runs no head code.
#
# Moving between the two triggers took two PRs (#83, then this one), because
# `pull_request_target` resolves against the BASE branch: with
# `pr-title / pr-title` already a required check, a single PR that swapped the
# trigger would have found `pull_request_target` on neither base nor head, the
# check would never have reported, and the required gate would have blocked its
# own fix. #83 added the new triggers while keeping `pull_request`; this commit
# removes `pull_request`, which lands cleanly now that main carries the rest.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions:
  pull-requests: read

# The PR number scopes cancellation to exactly one PR (head_ref would collide
# across same-named fork branches). Falls back to `github.ref`, not `run_id`, so
# a merge_group run groups with the ref it is queued against rather than being
# unique per run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    permissions:
      pull-requests: read
    uses: melodic-software/ci-workflows/.github/workflows/semantic-pr.yml@1d3762c2ace413db0f347048307946c46850161c # 1d3762c 2026-07-10
