name: PR Require Checks

on:
  push:
    branches: [main]
  pull_request:
    # A fork pull request is never contract-only: its token is read-only on `pull_request`, so it cannot record lane state:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflows-in-forked-repositories
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# The contract-only group is unique per run because GitHub cancels a pending run in the same group whatever `cancel-in-progress` says:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: >-
    ${{ (github.event.pull_request.head.repo.full_name == github.repository &&
    (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
    (github.event.action == 'edited' && !github.event.changes.base)))
    && format('ci-contract-{0}-{1}', github.event.pull_request.number, github.run_id)
    || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: true

# This repo holds only community-health files (Markdown + issue/PR templates and
# config), so it consumes the org's reusable lint/hygiene actions from
# ci-workflows (at `@main`) against the vendored standards configs at the repo
# root, then aggregates them in job `ci-status` into the single `CI Status`
# check the org `ci-gate` ruleset requires. Each hygiene lane checks out this
# repo, then runs one remote action; `check-pr-sections` and
# `check-issue-forms` are the local-script exceptions noted below.
#
# Adding a lane: a new job gates merges once its name appears in the `ci-status`
# job's `needs:` list. Its `results:` input is derived from that list and needs
# no edit. Adding the job without the `needs:` entry leaves it running but
# ignored: `ci-status` stays green while it fails. Two lanes are local scripts
# rather than remote actions, and both are deliberately left out of `needs:`:
# they report drift but do not gate. `check-pr-sections` guards the PR-body
# contract, itself advisory: it fetches the `check-contract` `run.sh` at the
# ref `report-ci-status` uses and compares this repository's two PR-body mirrors
# to the sections that gate reports. `check-issue-forms` compares the synced
# issue forms to the synced issue-body contract.
jobs:
  markdownlint:
    name: markdownlint
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: melodic-software/ci-workflows/.github/actions/markdownlint@main
        with:
          config: .markdownlint-cli2.jsonc

  typos:
    name: Typos
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Spell-check
        uses: melodic-software/ci-workflows/.github/actions/typos@main
        with:
          config: _typos.toml
          # typos skips hidden files and directories by default, and almost every tracked path here is hidden:
          # https://github.com/crate-ci/typos/blob/master/docs/reference.md
          hidden: 'true'

  editorconfig-checker:
    name: EditorConfig Checker
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check editorconfig conformance
        uses: melodic-software/ci-workflows/.github/actions/editorconfig-checker@main
        with:
          config: .editorconfig-checker.json

  gitleaks:
    name: Gitleaks
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for secrets
        uses: melodic-software/ci-workflows/.github/actions/gitleaks@main
        with:
          config: .gitleaks.toml

  check-links:
    name: Check Links
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links and anchors (offline)
        uses: melodic-software/ci-workflows/.github/actions/lychee-offline@main
        with:
          config: lychee.toml
          # lychee skips hidden directories unless `--hidden` is set, so the default `**/*.md` misses `.claude/` and `.github/`:
          # https://lychee.cli.rs/guides/cli/
          globs: >-
            **/*.md
            .claude/**/*.md
            .github/**/*.md

  actionlint:
    name: Actionlint
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: melodic-software/ci-workflows/.github/actions/actionlint@main

  jsonschema:
    name: Jsonschema
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate dependabot.yml
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@main
        with:
          builtin-schema: vendor.dependabot
          files: .github/dependabot.yml
      - name: Validate workflows
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@main
        with:
          builtin-schema: vendor.github-workflows
          files: .github/workflows/*.yml
      - name: Derive the issue-form roster
        id: issue-forms
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          forms=()
          for form in .github/ISSUE_TEMPLATE/*.yml .github/ISSUE_TEMPLATE/*.yaml; do
            if [[ "${form##*/}" == config.yml ]]; then
              continue
            fi
            # The consuming action word-splits and re-globs whatever it receives,
            # so a name carrying whitespace or a glob metacharacter would be
            # mangled, and a bracket/star/question pattern that matches nothing
            # is dropped outright, leaving that form unvalidated with this step
            # still green. Refusing the name keeps that silent, which is the
            # failure mode deriving this list exists to remove.
            if [[ "$form" == *[[:space:]*?[]* ]]; then
              echo "::error::Issue-form path is unsafe for the consuming action's word-split and re-glob: $form"
              exit 1
            fi
            forms+=("$form")
          done
          if [[ ${#forms[@]} -eq 0 ]]; then
            echo '::error::No issue forms (*.yml/*.yaml other than config.yml) found under .github/ISSUE_TEMPLATE/.'
            exit 1
          fi
          echo "files=${forms[*]}" >> "$GITHUB_OUTPUT"
      - name: Validate issue forms
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@main
        with:
          builtin-schema: vendor.github-issue-forms
          files: ${{ steps.issue-forms.outputs.files }}
      - name: Validate issue-template chooser config
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@main
        with:
          builtin-schema: vendor.github-issue-config
          files: .github/ISSUE_TEMPLATE/config.yml
      # No vendored builtin covers Claude Code settings, so this reaches the unpinned schemastore URL; swap to a builtin if one ships:
      # https://check-jsonschema.readthedocs.io/en/stable/usage.html#builtin-schema
      - name: Validate Claude Code settings
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@main
        with:
          schemafile: https://json.schemastore.org/claude-code-settings.json
          files: .claude/settings.json

  shellcheck:
    name: Shellcheck
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell scripts
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@main
        with:
          rcfile: .shellcheckrc

  check-line-endings:
    name: Check Line Endings
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check index-level EOL drift
        uses: melodic-software/ci-workflows/.github/actions/check-line-endings@main

  check-pr-sections:
    name: Check PR Sections
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the drift checker
        run: node --test .github/scripts/pr-section-drift.test.mjs
      - name: Compare local mirrors to the composite
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-section-drift.mjs

  check-issue-forms:
    name: Check Issue Forms
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the drift checker
        run: node --test .github/scripts/issue-form-drift.test.mjs
      - name: Compare the issue forms to the contract
        run: node .github/scripts/issue-form-drift.mjs

  pr-audit-workflows:
    name: PR Audit Workflows
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      security-events: write
    uses: melodic-software/ci-workflows/.github/workflows/pr-audit-workflows.yml@main
    with:
      runner: ubuntu-24.04
      paths: .
      fail-on-severity: low

  ci-status:
    name: CI Status
    if: always()
    needs: [markdownlint, typos, editorconfig-checker, gitleaks, check-links, actionlint, jsonschema, shellcheck, check-line-endings, pr-audit-workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Aggregate lane results
        id: report
        uses: melodic-software/ci-workflows/.github/actions/pr-require-checks/report-ci-status@main
        with:
          step-name: Aggregate lane results
          draft: allow
          treat-skipped-as: pass
          results: ${{ join(needs.*.result, ' ') }}
      - name: Fail on the contract or draft policy
        if: ${{ !cancelled() && (steps.report.outputs.contract != 'success' || steps.report.outputs.draft != 'success') }}
        run: |
          echo "::error::ci-status: the pull-request contract or the draft policy failed; see the step above."
          exit 1
