name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The PR number scopes cancellation to exactly one PR (head_ref would collide
# across same-named fork branches); pushes to main fall back to the run id.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# This repo holds only community-health files (Markdown + issue/PR templates and
# config), so it consumes the org's reusable lint/hygiene actions from
# ci-workflows (pinned by SHA) against the vendored standards configs at the repo
# root, then aggregates them into the single `ci-status` check the org `ci-gate`
# ruleset requires. Each lane checks out this repo, then runs one remote action.
#
# Adding a lane: a new job gates merges only once its name appears in BOTH the
# `ci-status` job's `needs:` list and its `results:` expression. Adding the job
# alone leaves it running but ignored — `ci-status` stays green while it fails.
jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: melodic-software/ci-workflows/.github/actions/markdown@1d3762c2ace413db0f347048307946c46850161c # 1d3762c 2026-07-10
        with:
          config: .markdownlint-cli2.jsonc

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Spell-check
        uses: melodic-software/ci-workflows/.github/actions/typos@1d3762c2ace413db0f347048307946c46850161c # 1d3762c 2026-07-10
        with:
          config: _typos.toml

  editorconfig:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check editorconfig conformance
        uses: melodic-software/ci-workflows/.github/actions/editorconfig@1d3762c2ace413db0f347048307946c46850161c # 1d3762c 2026-07-10
        with:
          config: .editorconfig-checker.json

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for secrets
        uses: melodic-software/ci-workflows/.github/actions/gitleaks@1d3762c2ace413db0f347048307946c46850161c # 1d3762c 2026-07-10
        with:
          config: .gitleaks.toml

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links and anchors (offline)
        uses: melodic-software/ci-workflows/.github/actions/lychee-offline@1d3762c2ace413db0f347048307946c46850161c # 1d3762c 2026-07-10
        with:
          config: lychee.toml
          # The action's default `**/*.md` skips hidden directories, so Markdown
          # under `.claude/` and `.github/` went unchecked — verified against the
          # pinned lychee 0.24.2, where the default glob resolves 7 of this
          # repo's 9 Markdown files. Dot-prefixed globs are listed explicitly
          # rather than adding `--hidden` because this action exposes no
          # arbitrary-args input; the default glob is repeated, not replaced.
          globs: >-
            **/*.md
            .claude/**/*.md
            .github/**/*.md

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: melodic-software/ci-workflows/.github/actions/actionlint@1d3762c2ace413db0f347048307946c46850161c # 1d3762c 2026-07-10

  jsonschema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate dependabot.yml
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@058f5e42e81f9966e7f788bc4a0fe9849cea7c9d # 058f5e4 2026-07-20
        with:
          builtin-schema: vendor.dependabot
          files: .github/dependabot.yml
      - name: Validate workflows
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@058f5e42e81f9966e7f788bc4a0fe9849cea7c9d # 058f5e4 2026-07-20
        with:
          builtin-schema: vendor.github-workflows
          files: .github/workflows/*.yml
      - name: Validate issue forms
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@058f5e42e81f9966e7f788bc4a0fe9849cea7c9d # 058f5e4 2026-07-20
        with:
          builtin-schema: vendor.github-issue-forms
          files: >-
            .github/ISSUE_TEMPLATE/bug-report.yml
            .github/ISSUE_TEMPLATE/feature-request.yml
            .github/ISSUE_TEMPLATE/task.yml
      - name: Validate issue-template chooser config
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@058f5e42e81f9966e7f788bc4a0fe9849cea7c9d # 058f5e4 2026-07-20
        with:
          builtin-schema: vendor.github-issue-config
          files: .github/ISSUE_TEMPLATE/config.yml

  eol-renormalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check index-level EOL drift
        uses: melodic-software/ci-workflows/.github/actions/eol-renormalize@1d3762c2ace413db0f347048307946c46850161c # 1d3762c 2026-07-10

  ci-status:
    if: always()
    needs: [markdown, typos, editorconfig, gitleaks, links, actionlint, jsonschema, eol-renormalize]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Aggregate lane results
        uses: melodic-software/ci-workflows/.github/actions/ci-status@058f5e42e81f9966e7f788bc4a0fe9849cea7c9d # 058f5e4 2026-07-20
        with:
          # Derived from the `needs:` roster above rather than restating it: a lane
          # added there is aggregated here automatically. Hand-listing the results
          # let a lane be dropped from this input alone, which still gated the merge
          # via `needs:` but withheld its verdict from the aggregator — a silent
          # green on that lane's failure, caught by no linter. `join` over the
          # `needs.*` object filter yields the whitespace-separated form the action
          # documents and word-splits.
          results: ${{ join(needs.*.result, ' ') }}
