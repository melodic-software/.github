name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The PR number scopes cancellation to exactly one PR (head_ref would collide
# across same-named fork branches); pushes to main fall back to the run id.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# This repo holds only community-health files (Markdown + issue/PR templates and
# config), so it consumes the org's reusable lint/hygiene actions from
# ci-workflows (pinned by SHA) against the vendored standards configs at the repo
# root, then aggregates them into the single `ci-status` check the org `ci-gate`
# ruleset requires. Each hygiene lane checks out this repo, then runs one remote
# action; `pr-section-drift` is the local-script exception noted below.
#
# Adding a lane: a new job gates merges once its name appears in the `ci-status`
# job's `needs:` list. Its `results:` input is derived from that list and needs
# no edit. Adding the job without the `needs:` entry leaves it running but
# ignored — `ci-status` stays green while it fails. `pr-section-drift` is the
# one lane that is a local script rather than a remote action: it fetches the
# pinned `pr-issue-linkage` reusable and compares this repository's two PR-body
# mirrors to that ref's `requiredSections` (issue #58). A fetch failure is red,
# never a skip — the same posture as standards' `pr-convention-lockstep`.
jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: melodic-software/ci-workflows/.github/actions/markdown@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          config: .markdownlint-cli2.jsonc

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Spell-check
        uses: melodic-software/ci-workflows/.github/actions/typos@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          config: _typos.toml

  editorconfig:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check editorconfig conformance
        uses: melodic-software/ci-workflows/.github/actions/editorconfig@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          config: .editorconfig-checker.json

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for secrets
        uses: melodic-software/ci-workflows/.github/actions/gitleaks@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          config: .gitleaks.toml

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links and anchors (offline)
        uses: melodic-software/ci-workflows/.github/actions/lychee-offline@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          config: lychee.toml
          # The action's default `**/*.md` skips hidden directories, so Markdown
          # under `.claude/` and `.github/` went unchecked — verified against the
          # pinned lychee 0.24.2, where the default glob resolves 7 of this
          # repo's 9 Markdown files. Dot-prefixed globs are listed explicitly
          # rather than adding `--hidden` because this action exposes no
          # arbitrary-args input; the default glob is repeated, not replaced.
          globs: >-
            **/*.md
            .claude/**/*.md
            .github/**/*.md

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: melodic-software/ci-workflows/.github/actions/actionlint@0f8176e87e0be518f382664779655011bf95784a # v0.17.2

  jsonschema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate dependabot.yml
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          builtin-schema: vendor.dependabot
          files: .github/dependabot.yml
      - name: Validate workflows
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          builtin-schema: vendor.github-workflows
          files: .github/workflows/*.yml
      # Derived from the directory rather than restating it, for the same reason
      # `ci-status` derives its lane list — a hand-listed roster let a newly
      # added issue form go unvalidated with this lane still green, and nothing
      # caught the omission. Unlike `ci-status` this cannot be an expression:
      # Actions expressions have no filesystem access, so the roster is built in
      # shell. Everything matching *.yml/*.yaml here is an issue form except
      # `config.yml`, the chooser the next step validates against its own schema.
      - name: Derive the issue-form roster
        id: issue-forms
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          forms=()
          for form in .github/ISSUE_TEMPLATE/*.yml .github/ISSUE_TEMPLATE/*.yaml; do
            if [[ "${form##*/}" == config.yml ]]; then
              continue
            fi
            # The consuming action word-splits and re-globs whatever it receives,
            # so a name carrying whitespace or a glob metacharacter would be
            # mangled — and a bracket/star/question pattern that matches nothing
            # is dropped outright, leaving that form unvalidated with this step
            # still green. Refusing the name keeps that silent, which is the
            # failure mode deriving this list exists to remove.
            if [[ "$form" == *[[:space:]*?[]* ]]; then
              echo "::error::Issue-form path is unsafe for the consuming action's word-split and re-glob: $form"
              exit 1
            fi
            forms+=("$form")
          done
          if [[ ${#forms[@]} -eq 0 ]]; then
            echo '::error::No issue forms (*.yml/*.yaml other than config.yml) found under .github/ISSUE_TEMPLATE/.'
            exit 1
          fi
          echo "files=${forms[*]}" >> "$GITHUB_OUTPUT"
      - name: Validate issue forms
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          builtin-schema: vendor.github-issue-forms
          files: ${{ steps.issue-forms.outputs.files }}
      - name: Validate issue-template chooser config
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          builtin-schema: vendor.github-issue-config
          files: .github/ISSUE_TEMPLATE/config.yml
      # No vendored builtin covers Claude Code settings, so this validates
      # against the same schemastore URL the file itself declares in `$schema`.
      # Unlike every other lane this reaches an unpinned remote schema, so a
      # breaking schemastore change reddens the lane without this repo changing
      # — swap to a builtin if one ever ships.
      - name: Validate Claude Code settings
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          schemafile: https://json.schemastore.org/claude-code-settings.json
          files: .claude/settings.json

  # The SessionStart bootstrap is this lane's only input — discovery is tracked
  # *.sh/*.bash files — and it arrives by standards sync already written against
  # the canonical .shellcheckrc (it carries `disable=` directives and cites
  # check-set-e-suppressed/SC2310). Nothing was checking that until this lane.
  # The `jsonschema` job's roster step is shell too, but an embedded `run:` block
  # is not a file this discovery sees; the `actionlint` lane covers it instead,
  # via its own bundled ShellCheck, which does not read .shellcheckrc.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell scripts
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          rcfile: .shellcheckrc

  eol-renormalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check index-level EOL drift
        uses: melodic-software/ci-workflows/.github/actions/eol-renormalize@0f8176e87e0be518f382664779655011bf95784a # v0.17.2

  # Compares `.github/PULL_REQUEST_TEMPLATE.md` headings and
  # `.claude/source-control.md`'s `pr_body_required_sections` to the
  # `requiredSections` array inside the SHA-pinned `pr-issue-linkage` reusable
  # (issue #58). The comparison target is that pin's bytes, not a third
  # hardcoded copy of the four names. Fetches over the network; a fetch
  # failure is red, never a skip — same posture as standards'
  # `pr-convention-lockstep` (ADR-0008).
  pr-section-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the drift checker
        run: node --test .github/scripts/pr-section-drift.test.mjs
      - name: Compare local mirrors to the pinned reusable
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-section-drift.mjs

  ci-status:
    if: always()
    needs: [markdown, typos, editorconfig, gitleaks, links, actionlint, jsonschema, shellcheck, eol-renormalize, pr-section-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Aggregate lane results
        uses: melodic-software/ci-workflows/.github/actions/ci-status@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
        with:
          # Derived from `needs:` rather than restating it. Hand-listing the
          # results let a lane be dropped from this input alone — still gated via
          # `needs:`, but its verdict withheld from the aggregator, so the check
          # went green on that lane's failure with no linter to catch it. `join`
          # over the `needs.*` object filter yields the whitespace-separated form
          # the action word-splits.
          results: ${{ join(needs.*.result, ' ') }}
